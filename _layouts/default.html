<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.title != site.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_newlines }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0a0c10">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<header class="site-head">
  <div class="head-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="GenBasic home">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="2.2" fill="currentColor"/>
        <path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4"
              fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M19.1 4.9a10 10 0 0 1 0 14.2M4.9 19.1a10 10 0 0 1 0-14.2"
              fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
              opacity=".45"/>
      </svg>
      <span>GenBasic<span class="tm">&trade;</span></span>
    </a>
    <nav aria-label="Primary">
      <a href="{{ '/#adapters' | relative_url }}">Adapters</a>
      <a href="{{ '/#compare' | relative_url }}">Compare</a>
      <a href="{{ '/#drivers' | relative_url }}">Drivers</a>
      <a href="{{ '/#support' | relative_url }}">Support</a>
    </nav>
  </div>
</header>

<main id="main">
{{ content }}
</main>

<footer class="site-foot">
  <div class="foot-inner">
    <p class="foot-brand">GenBasic<span class="tm">&trade;</span></p>
    <nav aria-label="Footer">
      <a href="http://wiki.genbasic.com/">Documentation</a>
      <a href="{{ '/#support' | relative_url }}">Support</a>
    </nav>
    <p class="foot-legal">&copy; {{ site.time | date: '%Y' }} GenBasic. All rights reserved.</p>
  </div>
</footer>

</body>
</html>
