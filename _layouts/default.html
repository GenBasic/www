<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.title != site.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_newlines }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>

<header class="site-head">
  <a class="wordmark" href="{{ '/' | relative_url }}">GenBasic<span class="tm">&trade;</span></a>
  <nav>
    <a href="{{ '/#products' | relative_url }}">Products</a>
    <a href="{{ '/#support' | relative_url }}">Support</a>
  </nav>
</header>

<main>
{{ content }}
</main>

<footer class="site-foot">
  <p>&copy; {{ site.time | date: '%Y' }} GenBasic. All rights reserved.</p>
  <p><a href="http://wiki.genbasic.com/">Product guides &amp; documentation</a></p>
</footer>

</body>
</html>
