<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.title != site.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_newlines }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<header class="site-head">
  <div class="head-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="GenBasic home">
      <span>GenBasic<span class="tm">&trade;</span></span>
    </a>
    <nav aria-label="Primary">
      <a href="{{ '/products/' | relative_url }}">Products</a>
      <a href="{{ '/#approach' | relative_url }}">Why GenBasic</a>
      <a href="{{ '/#linux' | relative_url }}">Linux</a>
    </nav>
  </div>
</header>

<main id="main">
{{ content }}
</main>

<footer class="site-foot">
  <div class="foot-inner">
    <p class="foot-brand">GenBasic<span class="tm">&trade;</span></p>
    <nav aria-label="Footer">
      <a href="{{ '/products/' | relative_url }}">Products</a>
      <a href="{{ '/products/rf-2a4m1/' | relative_url }}">RF 2A4M1</a>
      <a href="{{ '/products/rf-2a5r1b4/' | relative_url }}">RF 2A5R1B4</a>
      <a href="{{ '/products/power-supply-5v3a/' | relative_url }}">Power supply</a>
    </nav>
    <p class="foot-legal">&copy; {{ site.time | date: '%Y' }} GenBasic. All rights reserved.</p>
  </div>
</footer>

</body>
</html>
